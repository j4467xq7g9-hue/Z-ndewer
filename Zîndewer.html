<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sako neutral | زیندەوەر ١٢</title>
    <!-- Web App Manifest for "Install to Home Screen" feel -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #00695c;
            --secondary: #4db6ac;
            --accent: #ffb74d;
            --bg: #eceff1;
            --surface: #ffffff;
            --text: #263238;
            --success: #4caf50;
            --error: #f44336;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        body.dark-mode {
            --primary: #80cbc4;
            --secondary: #004d40;
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #eceff1;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 600px; background: var(--surface); display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; box-shadow: var(--shadow); }
        
        /* Header */
        .header { padding: 15px 20px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1); z-index: 10; }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--primary); letter-spacing: -0.5px; }
        .theme-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        /* Screens */
        .screen { flex: 1; display: none; flex-direction: column; padding: 20px; overflow-y: auto; align-items: center; text-align: center; }
        .screen.active { display: flex; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Home Screen */
        .hero-icon { font-size: 5rem; margin: 40px 0 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .btn-main { width: 100%; padding: 18px; border: none; border-radius: 12px; background: var(--primary); color: white; font-size: 1.2rem; font-weight: bold; margin-top: auto; cursor: pointer; box-shadow: 0 5px 15px rgba(0,105,92,0.3); }
        .btn-main:active { transform: scale(0.98); }
        .info-card { background: rgba(0,105,92,0.05); padding: 20px; border-radius: 15px; width: 100%; text-align: right; border: 1px solid var(--primary); margin-bottom: 20px; }

        /* Quiz Screen */
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 1.3rem; font-weight: 700; line-height: 1.5; margin-bottom: 20px; text-align: right; width: 100%; }
        .img-area { width: 100%; margin-bottom: 15px; border-radius: 10px; overflow: hidden; border: 2px solid rgba(0,0,0,0.1); display: none; }
        .img-area img { width: 100%; display: block; }
        .options-grid { display: grid; gap: 12px; width: 100%; }
        .option { background: var(--bg); border: 2px solid transparent; padding: 15px; border-radius: 12px; font-weight: 600; cursor: pointer; text-align: right; position: relative; }
        .option.correct { background: rgba(76,175,80,0.2); border-color: var(--success); color: var(--success); }
        .option.wrong { background: rgba(244,67,54,0.2); border-color: var(--error); color: var(--error); }
        .option.disabled { pointer-events: none; opacity: 0.7; }

        /* Result Screen */
        .score-circle { width: 160px; height: 160px; border-radius: 50%; background: conic-gradient(var(--primary) 0%, transparent 0); display: flex; justify-content: center; align-items: center; margin: 30px 0; font-size: 3rem; font-weight: 900; color: var(--primary); position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .score-circle::before { content: ''; position: absolute; width: 140px; height: 140px; background: var(--surface); border-radius: 50%; }
        .score-text { position: relative; z-index: 2; }
        .stat-row { display: flex; gap: 20px; width: 100%; margin-bottom: 30px; }
        .stat-box { flex: 1; background: var(--bg); padding: 15px; border-radius: 12px; }
        .stat-num { font-size: 1.5rem; font-weight: bold; display: block; }
        
        .footer { padding: 10px; text-align: center; font-size: 0.8rem; color: #888; border-top: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="theme-btn" onclick="toggleTheme()">🌙</button>
        <div class="logo">Sako neutral</div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
        <div class="hero-icon">🧬</div>
        <h1 style="color:var(--primary); margin:0;">زیندەوەر ١٢</h1>
        <p style="color:#888; margin-top:5px;">باشترین ڕێبەر بۆ سەرکەفتنێ</p>
        
        <div class="info-card">
            <p>📋 <strong>بەندێ:</strong> ئێکەم</p>
            <p>❓ <strong>کۆی پرسیار:</strong> 180</p>
            <p>⏱ <strong>دەم:</strong> بێ سنور</p>
            <hr style="opacity:0.2">
            <p style="font-size:0.9rem">ئەڤ ئەپە هاتیە دیزاین کرن ژبۆ بهێزکرنا ئاستێ قوتابیان. هیڤیە مفای لێ ببینن.</p>
        </div>

        <button class="btn-main" onclick="startQuiz()">دەستپێبکە 🚀</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:5px; font-size:0.9rem; font-weight:bold;">
            <span id="q-progress">1 / 180</span>
            <span>بەندێ ١</span>
        </div>
        <div class="progress-bar"><div id="p-fill" class="progress-fill"></div></div>

        <div class="img-area" id="img-box">
            <img id="q-img" src="" alt="Wêne">
        </div>

        <div id="q-text" class="question-text">Loading...</div>
        <div id="opt-container" class="options-grid"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">
        <h2>ئەنجامێ کۆتایی</h2>
        <div class="score-circle" id="circle-bg">
            <span class="score-text" id="final-score">0%</span>
        </div>

        <div class="stat-row">
            <div class="stat-box">
                <span class="stat-num" id="res-correct" style="color:var(--success)">0</span>
                <span>ڕاست</span>
            </div>
            <div class="stat-box">
                <span class="stat-num" id="res-wrong" style="color:var(--error)">0</span>
                <span>خەلەت</span>
            </div>
        </div>

        <p id="res-msg" style="font-weight:bold; font-size:1.1rem; margin-bottom:30px;"></p>
        <button class="btn-main" onclick="location.reload()">دوبارە بکە 🔄</button>
    </div>

    <div class="footer">Developed by Sako neutral © 2026</div>
</div>

<script>
    // --- DATABASE: 180 QUESTIONS ---
    // 0=A, 1=B, 2=C, 3=D
    const db = [
        { q: "١- پەیکەرە کۆنە ئەندام :", o: ["تە ژ نەخۆشی و توشبوونان دپارێزیت", "پالپشتیا ئەندامێن ناڤدا دکەت و دپارێزیت", "هەڤسەنگیا ناڤێ و ماددێن کیمیایی دپارێزیت", "پلا گەرما لەشی ڕێکدئێخیت و لەشی ژ هوکارێن نەخۆشیێ دپارێزیت"], a: 1 },
        { q: "٢- ئەندامێن زاوزێ دکەڤنە د ناڤ ... :", o: ["کلوخە کەلێنێ", "سترییە کەلێنێ", "سینگە کەلێنێ", "حەوزە کەلێنێ"], a: 3 },
        { q: "٣- کیژ ژڤان نمونەیە بۆ گەهێن لقێن سنوردار :", o: ["گەها تەوەرێ", "گەها رزدەپێ", "گەها زینی", "نە چ ژوان"], a: 2 },
        { q: "٤- تەوەرە پەیکەرڤان هەستیان بخۆڤە دگریت :", o: ["هەردوو لنگ و چنگلان", "هەردوو مل", "کلوخ و بڕبڕا پشتی", "هەردوو رانان"], a: 2 },
        { q: "٥- خانێن خوینی پەیدا دبن ژ :", o: ["بەرگێ هەستی", "مەژیێ هەستی", "شلە گەهێ", "پەرێ سەرێ هەستی"], a: 1 },
        { q: "٦- کیژ ژڤانە روویدەت دەمێ بەرگرییە کۆنە ئەندام هێرشێ دکەتە سەر شانێن لەشی و دبيتە ئەگەرێ تێکچوونا گەهان :", o: ["هەودانا هەستی", "هەودانا پەڕێ هەستی", "هەودانا روماتیدی", "هەودانا سەرێ هەستی"], a: 2 },
        { q: "٧- کیژ ڤان پێکهاتە یێن ماسولکە خانە یێ دیار دکەت کو ژ بچووک بۆ مەزن ڕێکخستییە :", o: ["دەزیێن ئەکتین و مایوسین - ماسولکە ڕیشالۆک - پارچە ماسولکە", "پارچە ماسولکە - ماسولکە ڕیشال - ماسولکە ڕیشالۆک", "ماسولکە ڕیشالۆک - ماسولکە ڕیشال - دەزیێن ئەکتین و مایوسین", "دەزیێن ئەکتین و مایوسین - پارچە ماسولکە - ماسولکە ڕیشالۆک"], a: 3 },
        { q: "٨- دبیت وەستیان و ئیشانا ماسولکا روو بدەت دەمێ :", o: ["بڕا (ATP) یا بکار هاتی یەکسان بیت بڕا (ATP) یا بەرهەم هاتی", "بڕا (ATP) یا بکار هاتی کێمتر بیت بڕا (ATP) یا بەرهەم هاتی", "بڕا (ATP) یا بکار هاتی زۆرتر بیت بڕا (ATP) یا بەرهەم هاتی", "نە چ ژڤانە"], a: 2 },
        { q: "٩- ئەو ئەندام چنە یێن دکەڤنە ناڤ سینگە کەلێنێدا :", o: ["دەماخ", "بڕبڕا پشتی", "ئەندامێن کۆئەندامێ هەرسێ", "ئەندامێن کۆئەندامێ هەناسێ"], a: 3 },
        { q: "١٠- کیژ ژڤان ئەو ماددەیە یێ خانە یێن بەستەرە شانەیێ تێدا نقوم دبن :", o: ["ناڤبەرە ماددە", "بەڕگێ هەستی", "مەژیێ هەستی", "شلە گەهـ"], a: 0 },
        { q: "١١- کیژ ژڤانان کارێ بەڕگێ هەستییە :", o: ["هەستی دادپۆشیت", "مەژیێ هەستی یێ تێدا", "ژ خانە یێن مری یێ پێکهاتی", "درێژیا هەستیێن درێژ زێدە دکەت"], a: 0 },
        { q: "١٢- ڤان ڕێکەفتنان تەمام بکە ، دەمار : دەمارە خانە ، هەستی : ............", o: ["دەماخ", "پەیکەرێ هەستی", "هەستییە خانە", "جۆکا هاڤەرس"], a: 2 },
        { q: "١٣- کیژ ژمارە ئاماژێ ب هێلا Z ددەت :", o: ["1", "2", "3", "4"], a: 0, img: "img/13.jpg" }, 
        { q: "١٤- دەمارە شانە خانە یێن تایبە تەمەند تێدانە دبێژنێ :", o: ["ڤەگوێزەر", "بەدەمارە خانە", "ماسولکە خانە", "خانە یێن دڵی"], a: 0 }, 
        { q: "١٥- ئەو شانە یا پێکهاتە یان پێکڤە گرێدەت و پشتەڤانیا وان دکەت و دپارێزیت دبێژنێ", o: ["بەستەرە شانە", "پەیكەرە بەستەرە شانە", "ماسولکە شانە", "ڕوکەشە شانە"], a: 0 },
        { q: "١٦- هەر کۆنە ئەندامەکێ دلەشێ مرۆڤی دا پێکهاتییە ژ چەند :", o: ["شانە یان", "ئەندامان", "خانە یان", "هەمی"], a: 1 },
        { q: "١٧- ئەو ڤالاهیا زکی یا دل و سورسورک و ئەندامێن کۆنە ئەندامێ هەناسی تێدانە ئەڤەیە :", o: ["کلوخە کەلێن", "سترییە کەلێن", "زکە کەلێن", "سینگە کەلێن"], a: 3 },
        { q: "١٨- ئەو کۆنە ئەندامە کو هەردوو گورچیسك و دوو بۆریێن میزی و میز دانك و پیستی بخۆڤە دگریت :", o: ["پوشەرە کۆنە ئەندام", "کۆنە ئەندامێ دەرهاڤێشتنێ", "سترییە کەلێن", "کورە ڕژێنە کۆنە ئەندام"], a: 1 },
        { q: "١٩- ئەو کریارا تێدا خانە یێن هەستی هێدی هێدی جهێ کرکرکێ دگرن دبێژنێ :", o: ["پێکهاتنا هەستی", "چێبوون", "هەودانا گەهێن هەستی", "چ ژوان نینن"], a: 0 },
        { q: "٢٠- تەوەرە پەیکەرڤان هەستیان بخۆڤە دگریتن:", o: ["هەردوو چنگل", "هەردوو لنگ", "پراسی", "هەمی"], a: 2 },
        { q: "٢١- گەهێن لقێن سنوردار دکەڤنە :", o: ["هەردوو چۆکاندا", "هەردوو تبلێن بەرانان یێن دەستی", "دناڤبەرا بڕبڕان", "هەردوو ئەنیشکان دا"], a: 2 },
        { q: "٢٢- هەستی یێلجهێ خۆ هاتیە خوجهکرن بهندەک گورزێن بهێز دبێژنێ:", o: ["بەستەرە", "ژێ", "گەها تەحسوک", "ماسولکە"], a: 0 },
        { q: "٢٣- هەودانا گەهێن هەستی دهێتە جوداکرن ب :", o: ["ژێککێشانا بەستەران", "تێکشکاندنا هەستی", "بەرگری دژی خۆ", "تەنکبوونا کرکرکێ"], a: 2 },
        { q: "٢٤- کیژ جۆرێ ڤان ماسولکە شانە یان د دیوارێ گەدێ و ڕیڤیکا زراڤ و لولە یێن خوینێ دا هەیە :", o: ["دڵە ماسولکە", "حولیلە ماسولکە", "پەیکەرە ماسولکە", "ماسولکە یا خۆڤێن"], a: 1 },
        { q: "٢٥- کیژ جۆرێ ماسولکە یێ بەرپرسە ژ لڤاندنا پتربیا پشکێن لەشی :", o: ["دڵە ماسولکە", "حولیلە ماسولکە", "پەیکەرە ماسولکە", "ماسولکە یا خۆڤێن"], a: 2 },
        { q: "٢٦- پارچە ماسولکە :", o: ["یەکەیە فرمانی گرژبوونا ماسولکییە", "ب ATP بکاردئینیت", "ژ ماسولکە ڕیشالۆکان پێکهێت", "ئەڤە هەمی"], a: 3 },
        { q: "٢٧- ئەو ماسولکە یێن پشکداریێ د ڤەچەماندنا گەهێ دا دکەن دبێژنێ :", o: ["گرژۆکە ماسولکە", "کێشۆکە ماسولکە", "بنک", "پێگە بەست"], a: 1 }, 
        { q: "٢٨- ل دەمێ گرژبوونا پەیکەرە ماسولکەیێدا کیژ ژڤانە رووددەت :", o: ["کورتبوونا پارچە ماسولکەیێ", "سەرێن مایوسینێ ب دەزیێن ئەکتینێ ڤە د نویستن", "سەرێن مایوسینێ بەرەڤ ژناڤدا د چەمین", "هەمی"], a: 3 },
        { q: "٢٩- (٢٠١٣-٢٠١٤ دەرەکی) کیژ ژڤان فرمانی بەرگێ هەستیه :", o: ["هەستی دادپوشێت", "ماددە یێن خوارنێ ددەتە هەستی", "ئا زارە راگەهاندنان ڤەدگوهێزیت", "هەمی یێن هاتین د راستن"], a: 3 },
        { q: "٣٠- (٢٠١٣-٢٠١٤ دەرەکی) ئەو شانە یا ناپپۆشێ روویێ ژدەرڤە و ژناڤدایێ هەمی لەشی دکەت پێکهاتیە ژ :", o: ["رووکە شە شانە", "بەستەرە شانە", "ماسولکە شانە", "دەمارە شانە"], a: 0 },
        { q: "٣١- ئەو شانا ناپپۆشا روویێ ژدەرڤە و ژناڤدا یێ هەمی لە شی دکەت :", o: ["روکە شە شانە", "بە سته رە شانە", "دەمارە شانە", "ماسولکە شانە"], a: 0 },
        { q: "٣٢- ئەو ماسولکا گەهێ ڤە دچەمینیت :", o: ["گرژۆك", "كێشۆك", "بنك", "جهبەست"], a: 1 },
        { q: "٣٣- تەوەرە پەیکە رەه ستیێن ...... ڤە دگریت :", o: ["هە ردوو ملان", "بڕبڕا پشتی", "حە وز", "نە چ ژوان"], a: 1 },
        { q: "٣٤- مەژیێ زەرێ هە ستی :", o: ["د هەستیێ ئیسفە نجی دا هەیە", "ب خروکێن سورێن خوینێ بەرهەمدینت", "وەك كۆگەك بۆ وزا يه ده ك كار دكه ت", "أ و ج پێکڤە دراستن"], a: 2 },
        { q: "٣٥- هێزا گرژبوونا پەیکەرێ ماسولکێ بەندە لسەر :", o: ["جهێ وێ د لەشيدا", "بڕا (ATP) یا پێ دگەهیت", "ژمارا وان ماسولکە ریشالان کو هشیار دکەت", "بڕا هێزا دەمارە راگەهاندنێ یا پێدگەهیت"], a: 2 },
        { q: "٣٦- ئەندام پێکدهێت ژ :", o: ["کومە کا خانین وەکهەڤ د پێکهاتنێ دا", "شانێن وەکهەڤ پێکڤە کاردکە ن", "شانێن جوراوجور پێکڤە کاردکە ن", "ب و ج پێکڤە دراستن"], a: 2 },
        { q: "٣٧- گەهێن لقێن سنوردارد ....... هەنە :", o: ["هەردوو چوکزندا", "ناڤبەرا بڕبڕاندا", "پراسیێن سینگیدا", "ب و ج پێکڤە دراستن"], a: 1 },
        { q: "٣٨- زوورترین و هە مە جورترین جورێ شانا دڵە شی دا :", o: ["بە ستە رە", "روکە شە", "ده ماره", "ماسولكه"], a: 0 },

        { q: "١٧٤- (٢٠٢٠-٢٠٢١ خولا دووێ) د کریارا دروستبوونا کیژ هەستیێن ل خوارێ , خانەيێن هەستی ب شێوەیەکێ بڕالە د ناڤ بەستەرە شانەیا کورپەلەیدا د بەربەلاڤن , بەلێ بنەز ب شێوەيێ تیخان ئێک دگرن دا ببنە پەركێن تەخت د هەستیدا :", o: ["ئەو هەستیێن ب شێوەيێ ڕەق دروستدبن بێی کو جارا ئیکێ د قۆناغا کرکرکێدا بچن", "ب- هەمی جورێن هەستیان", "ج- ئەو هەستیێن کو جارا ئیکێ د قۆناغا کرکرکێدا بچن"], a: 0 },
        { q: "١٧٥- (٢٠٢٠-٢٠٢١ خولا دووێ) ریشالێن ماسولکەیا حولی جودایە ژریشالێن پەیکەرە ماسولکەیێ بوی چەندێ کو ریشالێن ماسولکەیا حولی :", o: ["ب بەستەرە شانەيێ نە دەوردانە", "ب- ب بەستەرە شانەکێ دەورداینە کو یه ك دگرن بو پێكئینانا ژێیان", "ج- ب بەستەرە شانەکێ دەورداینە کو یه ك نادگرن بو پێكئینانا ژێیان", "د- زوور نافك يێن تێدا هه ين"], a: 2 },
        { q: "١٧٦- (٢٠٢٠-٢٠٢١ خولا دووێ) گەها ......... شیانێ ددەتە چنگلی ب زڤروکەكا تەمام ب زڤرینیت :", o: ["تەوەرەی", "ب- رزدەى", "ج- گویی", "د- تەحسوک"], a: 2, img: "img/176.jpg" },
        { q: "١٧٧- (٢٠٢٠-٢٠٢١ خولا دووێ) دڤێ شێوەیێ بەرامبەردا کیژ رەنوس ئاماژێ ب ڤێ جهی دکەت کو ددەمێ گرژبوونا تەمامی یا پەیکەرە ماسولکەیێ ئەو جه بەرزە دبیت نا مینیت :", o: ["1", "2", "3", "4"], a: 3, img: "img/177.jpg" },
        { q: "١٧٨- (٢٠٢٠-٢٠٢١ خولا دووێ) کیژ ژڤان نە ئەرکه به تەمامکاریا کۆنە ئەندامان :", o: ["پارڤەکرنا ماددەيێن خۆراکیێن پەیدابووی ژ کۆنە ئەندامێ هەرسێ ب هاریکاریا زڤرۆکە کۆنە ئەندامێ دهێتە کرن", "ب- چالاکیا زڤرۆکە کۆنە ئەندامێ پشت ب ماددەيێن خوارنێ دبەستیت ئە وێن ژ کۆنە ئەندامێ هەرسێ دهێن و وێ ئوکسجینێ کو ژ کۆنە ئەندامێ هەناسێ دهێت", "ج- کۆنە ئەندامێ کورە ڕژێنان هورمۆنان دەردده ت کو چالاکیا کۆنە ئەندامێ زاوزێ ڕێکدئیخیت", "د- هەمی د راستن"], a: 3 },
        { q: "١٧٩- (٢٠٢٠-٢٠٢١ خولا دووێ) کیژ ژڤانە نمونەیە بو بەستەرە شانە :", "o": ["خوین", "ب- تیخا ژدەرڤە د پێکهاتەيێن لولەيێن خوینێدا", "ج- ئەو شانەیا بوریا هەوای ناڤپوش دکەت", "د- چەوریە شانە"], a: 0 },
        { q: "١٨٠- (٢٠٢٠-٢٠٢١ خولا دووێ) روویێ وەکهڤیێ دناڤبەرا مەژیێ زەرێ هەستی و مەژیێ سوری هەستی ئەوەیه که هەردوو :", o: ["دهەستیێ درێژدا هەنە", "ب- ژچەوریە خانان پێکهاتییە", "ج- خانەيێن خوینێ بەرهەمدئینن", "د- د هەستیێ ئیسفەنجیدا هەنە"], a: 0 }
    ];

    // --- LOGIC ---
    let currentQ = 0;
    let score = 0;
    let isAnswered = false;

    // Elements
    const screens = document.querySelectorAll('.screen');
    const qText = document.getElementById('q-text');
    const qImg = document.getElementById('q-img');
    const imgBox = document.getElementById('img-box');
    const optContainer = document.getElementById('opt-container');
    const pFill = document.getElementById('p-fill');
    const qProgress = document.getElementById('q-progress');
    const finalScore = document.getElementById('final-score');
    const resCorrect = document.getElementById('res-correct');
    const resWrong = document.getElementById('res-wrong');
    const resMsg = document.getElementById('res-msg');
    const circleBg = document.getElementById('circle-bg');

    function showScreen(id) {
        screens.forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
        currentQ = 0;
        score = 0;
        showScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        const data = db[currentQ];
        
        // Progress
        const percent = ((currentQ) / db.length) * 100;
        pFill.style.width = `${percent}%`;
        qProgress.innerText = `${currentQ + 1} / ${db.length}`;

        // Text
        qText.innerText = data.q;

        // Image Handling
        if (data.img) {
            imgBox.style.display = 'block';
            qImg.src = data.img;
            qImg.onerror = function() {
                imgBox.style.display = 'none';
            }
        } else {
            imgBox.style.display = 'none';
        }

        // Options
        optContainer.innerHTML = '';
        data.o.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, data.a, btn);
            optContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, correctIdx, btn) {
        if(isAnswered) return;
        isAnswered = true;

        const options = document.querySelectorAll('.option');
        options.forEach(o => o.classList.add('disabled'));

        if(selectedIdx === correctIdx) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            options[correctIdx].classList.add('correct');
        }

        setTimeout(() => {
            currentQ++;
            if(currentQ < db.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }, 1200);
    }

    function finishQuiz() {
        showScreen('result-screen');
        const percent = Math.round((score / db.length) * 100);
        finalScore.innerText = `${percent}%`;
        resCorrect.innerText = score;
        resWrong.innerText = db.length - score;

        // Colorize circle
        const color = percent >= 50 ? '#4caf50' : '#f44336';
        circleBg.style.background = `conic-gradient(${color} ${percent}%, transparent 0)`;
        circleBg.style.color = color;

        if(percent === 100) resMsg.innerText = "نایابە! تە هەموو زانین 🏆";
        else if(percent >= 80) resMsg.innerText = "گەلەک باشە! بەردەوام بە 🌟";
        else if(percent >= 50) resMsg.innerText = "باشە، بەلێ پێدڤییە پتر بخوینی 📚";
        else resMsg.innerText = "ئاستێ تە یێ لاوازە، هیڤی نەکەڤە! 💪";
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.querySelector('.theme-btn').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }
</script>
